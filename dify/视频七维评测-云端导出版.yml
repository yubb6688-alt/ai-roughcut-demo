    - env
    - FULL_FRAME_BASE_URL
    value: ''
    value_type: string
  - description: 服务鉴权密钥；请在 Dify 内填写，导出工作流前留空。
    id: 01ff520e-72fc-52ed-b4ed-7797b50027a2
    name: FULL_FRAME_API_KEY
    selector:
    - env
    - FULL_FRAME_API_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
