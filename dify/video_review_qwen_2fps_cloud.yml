    - data:
        code: "\"\"\"Dify code node: provisional visual observations and speech/text\
          \ comparison.\"\"\"\nimport difflib\nimport json\nimport math\nimport re\n\
          import unicodedata\n\n\ndef clean(value, limit=1200):\n    if not isinstance(value,\
          \ str):\n        return ''\n    value = re.sub(r'(?:https?://|oss://|data:|www\\\
          .)[^\\s<>]+', '[链接已隐藏]', value, flags=re.I)\n    value = re.sub(r'\\bsk-[A-Za-z0-9_-]+',\
          \ '[密钥已隐藏]', value)\n    return ''.join(c for c in value if c in '\\n\\\
          t' or ord(c) >= 32)[:limit]\n\n\ndef tokenize(text):\n    text = unicodedata.normalize('NFKC',\
          \ text).casefold()\n    return re.findall(r'[a-z0-9]+|[\\u3400-\\u9fff]|[^\\\
          W\\d_]', text, flags=re.UNICODE)\n\n\ndef read_vision(vision, status, script):\n\
          \    if status != 200:\n        return '【画面与脚本】云端画面分析失败，未评估。', []\n    try:\n\
          \        response = json.loads(vision)\n        choice = response['choices'][0]\n\
          \        if not isinstance(choice, dict):\n            raise ValueError()\n\
          \        finish_reason = choice.get('finish_reason')\n        if finish_reason\
          \ != 'stop':\n            return '【画面与脚本】画面分析未完整结束，未评估。', []\n        message\
          \ = choice['message']\n        if not isinstance(message, dict):\n     \
          \       raise ValueError()\n        raw = message.get('content')\n     \
          \   if not isinstance(raw, str) or not raw.strip():\n            return\
          \ '【画面与脚本】未获得有效的画面观察，未评估。', []\n    except (ValueError, TypeError, KeyError,\
          \ IndexError, AttributeError):\n        return '【画面与脚本】未获得有效的画面观察，未评估。',\
          \ []\n    raw = raw.strip()\n    if raw.startswith('```'):\n        raw\
          \ = re.sub(r'^```(?:json)?\\s*|\\s*```$', '', raw, flags=re.I)\n    try:\n\
          \        obj = json.loads(raw)\n    except (ValueError, TypeError):\n  \
          \      obj = None\n    if not isinstance(obj, dict):\n        return '【画面与脚本】画面分析结果格式无效，未评估。',\
          \ []\n    disclaimer = '以下是模型对抽样画面的初步判断，未经核验，可能遗漏或误判，不能证明全片合规。'\n    lines\
          \ = ['【画面与脚本】' + disclaimer]\n    summary = clean(obj.get('summary'), 500)\n\
          \    if summary:\n        lines.append('观察：' + summary)\n    observations\
          \ = obj.get('observations')\n    if isinstance(observations, list):\n  \
          \      for item in observations[:8]:\n            if not isinstance(item,\
          \ dict):\n                continue\n            observation = clean(item.get('observation'),\
          \ 300)\n            excerpt = item.get('script_excerpt')\n            if\
          \ not observation:\n                continue\n            line = '画面观察：'\
          \ + observation\n            if isinstance(script, str) and isinstance(excerpt,\
          \ str) and excerpt.strip() and excerpt in script:\n                line\
          \ += '；脚本原文：' + clean(excerpt, 200)\n            start, end = item.get('start_sec'),\
          \ item.get('end_sec')\n            if (isinstance(start, (int, float)) and\
          \ not isinstance(start, bool) and math.isfinite(start)\n               \
          \     and isinstance(end, (int, float)) and not isinstance(end, bool) and\
          \ math.isfinite(end)\n                    and 0 <= start < end <= 43200):\n\
          \                line += '；模型估计时间：' + str(start) + '–' + str(end) + ' 秒（未核验）'\n\
          \            lines.append(line)\n    risks = obj.get('possible_risks')\n\
          \    if isinstance(risks, list):\n        for risk in risks[:8]:\n     \
          \       if isinstance(risk, str) and risk.strip():\n                lines.append('疑似风险，需人工复核：'\
          \ + clean(risk, 250))\n    suggestions = obj.get('suggestions')\n    suggestions\
          \ = [clean(s, 180) for s in suggestions[:6] if isinstance(s, str) and s.strip()]\
          \ if isinstance(suggestions, list) else []\n    if len(lines) == 1:\n  \
          \      lines.append('模型没有给出可用观察，未评估。')\n    return '\\n'.join(lines), suggestions\n\
          \n\ndef parse_words(body, status):\n    if status != 200:\n        return\
          \ None, '语音结果读取失败。'\n    if not isinstance(body, list) or len(body) != 1\
          \ or not isinstance(body[0], str):\n        return None, '语音结果文件无效。'\n \
          \   try:\n        data = json.loads(body[0])\n        if not isinstance(data,\
          \ dict) or not isinstance(data.get('transcripts'), list):\n            return\
          \ None, '语音结果格式无效。'\n        words = []\n        last_start = -1\n     \
          \   for transcript in data['transcripts']:\n            if not isinstance(transcript,\
          \ dict) or not isinstance(transcript.get('sentences'), list):\n        \
          \        return None, '语音句子格式无效。'\n            for sentence in transcript['sentences']:\n\
          \                if not isinstance(sentence, dict) or not isinstance(sentence.get('words'),\
          \ list):\n                    return None, '语音缺少词级时间戳。'\n              \
          \  for word in sentence['words']:\n                    if not isinstance(word,\
          \ dict):\n                        return None, '语音词条格式无效。'\n           \
          \         a, b, text = word.get('begin_time'), word.get('end_time'), word.get('text')\n\
          \                    if (isinstance(a, bool) or isinstance(b, bool) or not\
          \ isinstance(a, (int, float))\n                            or not isinstance(b,\
          \ (int, float)) or not math.isfinite(a) or not math.isfinite(b)\n      \
          \                      or a < 0 or a >= b or b > 43200000 or a < last_start\
          \ or not isinstance(text, str) or not text.strip()):\n                 \
          \       return None, '语音文字或时间戳无效。'\n                    if len(words) >=\
          \ 500:\n                        return None, '语音过长，本次无法完整对照。'\n        \
          \            words.append({'text': text, 'start_sec': a / 1000, 'end_sec':\
          \ b / 1000})\n                    last_start = a\n        return words,\
          \ ''\n    except (ValueError, TypeError, AttributeError):\n        return\
          \ None, '语音结果格式无效。'\n\n\ndef compare(script, words):\n    if not isinstance(script,\
          \ str) or not script.strip():\n        return '【配音内容对照】缺少脚本，未评估。', []\n\
          \    spoken = ''.join(w['text'] for w in words)\n    script_tokens, spoken_tokens\
          \ = tokenize(script), tokenize(spoken)\n    if not script_tokens or not\
          \ spoken_tokens or len(script_tokens) > 800 or len(spoken_tokens) > 800:\n\
          \        return '【配音内容对照】文字为空或太长，未评估。', []\n    matcher = difflib.SequenceMatcher(None,\
          \ script_tokens, spoken_tokens, autojunk=False)\n    omitted, extra = [],\
          \ []\n    for tag, i1, i2, j1, j2 in matcher.get_opcodes():\n        if\
          \ tag in ('delete', 'replace'):\n            omitted.extend(script_tokens[i1:i2])\n\
          \        if tag in ('insert', 'replace'):\n            extra.extend(spoken_tokens[j1:j2])\n\
          \    lines = ['【配音内容对照】按文字顺序做初步对照。脚本可能含镜头说明，识别也可能有错字，以下差异需要人工核对。']\n   \
          \ suggestions = []\n    if omitted:\n        lines.append('脚本中可能未对应到语音的文字片段：'\
          \ + clean(' '.join(omitted[:40]), 300))\n        suggestions.append('核对上述脚本片段是否需要配音；如确实漏读，可补录或调整脚本。')\n\
          \    if extra:\n        lines.append('识别到但未在脚本文字中对应的片段：' + clean(' '.join(extra[:40]),\
          \ 300))\n        suggestions.append('核对额外识别内容；如是误识别，请修正转写后复核。')\n    if\
          \ not omitted and not extra:\n        lines.append('识别文字与脚本文字按词序基本一致；仍需人工试听。')\n\
          \    lines.append('语音识别估计时间范围：' + str(words[0]['start_sec']) + '–' + str(words[-1]['end_sec'])\
          \ + ' 秒。')\n    return '\\n'.join(lines), suggestions\n\n\ndef _base_report_main(body:\
          \ list, status: int, vision: str, vision_status: int, script: str) -> dict:\n\
          \    picture, model_suggestions = read_vision(vision, vision_status, script)\n\
          \    words, reason = parse_words(body, status)\n    if words:\n        speech,\
          \ audio_suggestions = compare(script, words)\n        transcript = '【识别文字】'\
          \ + clean(''.join(w['text'] for w in words), 3000) + '\\n文字和时间为模型估计，请人工试听核对。'\n\
          \    else:\n        speech = '【配音内容对照】未评估：' + (reason or '没有检测到带时间的语音；不能据此确认没有音轨。')\n\
          \        transcript = ''\n        audio_suggestions = []\n    suggestions\
          \ = model_suggestions + audio_suggestions\n    advice = '【修改建议】\\n' + ('\\\
          n'.join('- ' + s for s in suggestions[:8]) if suggestions else '目前证据不足，请人工复核画面和配音。')\n\
          \    limits = '【未评估】分辨率、帧率和客观清晰度缺少云端技术检测；未提供带时间的配音脚本，不能评估配音时间对齐。规则检查仅供人工复核，综合评分未生成。'\n\
          \    return {'report': '\\n\\n'.join(x for x in (picture, transcript, speech,\
          \ advice, limits) if x)}\n\n\n\"\"\"Evidence-gated 21-criterion scoring.\
          \ Standard-library Dify node code.\"\"\"\nimport json\nimport math\nimport\
