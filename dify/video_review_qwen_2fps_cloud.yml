          \ status: int) -> dict:\n    try:\n        if status != 200: return {\"\
          state\":\"FAILED\",\"url\":\"\"}\n        output=json.loads(body).get(\"\
          output\",{})\n        state=output.get(\"task_status\")\n        if state\
          \ in (\"PENDING\",\"RUNNING\"): return {\"state\":\"PENDING\",\"url\":\"\
          \"}\n        if state != \"SUCCEEDED\": return {\"state\":\"FAILED\",\"\
          url\":\"\"}\n        results=output.get(\"results\",[])\n        if len(results)!=1\
          \ or results[0].get(\"subtask_status\")!=\"SUCCEEDED\": return {\"state\"\
          :\"FAILED\",\"url\":\"\"}\n        url=results[0].get(\"transcription_url\"\
          ,\"\")\n        p=urlsplit(url)\n        if p.scheme!=\"https\" or p.username\
          \ or p.password or p.port not in (None,443) or p.fragment or not re.fullmatch(r\"\
          [a-z0-9-]+\\.oss-[a-z0-9-]+\\.aliyuncs\\.com\",p.hostname or \"\"): return\
          \ {\"state\":\"FAILED\",\"url\":\"\"}\n        return {\"state\":\"SUCCEEDED\"\
          ,\"url\":url}\n    except (ValueError,TypeError,KeyError,AttributeError):\
          \ return {\"state\":\"FAILED\",\"url\":\"\"}\n"
