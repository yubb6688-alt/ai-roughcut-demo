    - data:
        code: "import json, re\nfrom urllib.parse import urlsplit\ndef main(body:\
          \ str, http_status: int) -> dict:\n    if http_status != 200:\n        raise\
          \ ValueError('申请上传凭证失败')\n    d=json.loads(body).get('data', {})\n    host=d.get('upload_host','')\n\
          \    parsed=urlsplit(host)\n    if parsed.scheme != 'https' or parsed.username\
          \ or parsed.password or parsed.port not in (None,443) or not re.fullmatch(r'dashscope-file-[a-z0-9-]+[.]oss-cn-beijing[.]aliyuncs[.]com',parsed.hostname\
          \ or '') or parsed.path not in ('','/') or parsed.query or parsed.fragment:\n\
          \        raise ValueError('上传地址不符合预期')\n    directory=d.get('upload_dir','')\n\
          \    if not re.fullmatch(r'dashscope-instant/[a-zA-Z0-9_./-]{1,512}',directory)\
          \ or '..' in directory.split('/'):\n        raise ValueError('上传路径不符合预期')\n\
          \    key=directory.rstrip('/')+'/video.mp4'\n    for field in ('oss_access_key_id','signature','policy','x_oss_object_acl','x_oss_forbid_overwrite'):\n\
          \        if not isinstance(d.get(field),str) or not d[field]: raise ValueError('上传凭证不完整')\n\
          \    if d['x_oss_object_acl']!='private' or d['x_oss_forbid_overwrite']!='true':\
          \ raise ValueError('上传凭证权限不符合预期')\n    return {'host':host,'object_key':key,'url':'oss://'+key,'access':d['oss_access_key_id'],'signature':d['signature'],'policy':d['policy'],'acl':d['x_oss_object_acl'],'overwrite':d['x_oss_forbid_overwrite']}\n"
        code_language: python3
