app:
  description: 调用外部全帧服务的异步工作流；服务需要单独部署和验证。
  icon: 🎞️
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 视频七维评测（云端全帧服务）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - id: 028fc9a6-d154-5139-b1f0-b0bd65094a80
    name: FULL_FRAME_BASE_URL
    value_type: string
    value: ''
    description: 管理员填写已部署的 HTTPS 服务根地址，或以 /api 结尾的地址。
  - id: 01ff520e-72fc-52ed-b4ed-7797b50027a2
    name: FULL_FRAME_API_KEY
    value_type: secret
    value: ''
    description: 服务鉴权密钥；请在 Dify 内填写，导出工作流前留空。
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - data:
        desc: ''
        selected: false
        title: 输入视频、脚本与规则
        type: start
        variables:
        - allowed_file_extensions: []
          allowed_file_types:
          - video
          allowed_file_upload_methods:
          - local_file
          label: 视频
          required: true
          type: file
          variable: video
        - label: 视频脚本
          max_length: 10000
          required: false
          type: paragraph
          variable: script
        - default: 检测视频各帧中可识别的人脸、国旗以及疑似品牌标识。发现疑似风险时应转人工；竞品身份无法确认时不得假称已确认。
          label: 评测规则（每行一条）
          max_length: 10000
          required: false
          type: paragraph
          variable: rules
        - label: 语音语言
          options:
          - en-US
          - zh-CN
          required: false
          type: select
          variable: asr_language
      height: 213
      id: start
      position: &id001
        x: 20
        y: 300
      positionAbsolute: *id001
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - id: prepare
      data:
        desc: ''
        selected: false
        title: 准备全帧任务
        type: code
        code_language: python3
        code: "\"\"\"Pure Dify code-node helpers for the external async full-frame job contract.\"\"\"\nimport json\n\
          import math\nimport re\nfrom urllib.parse import urlsplit\n\n\ndef _obj(value):\n    try:\n        obj\
          \ = json.loads(value)\n        return obj if isinstance(obj, dict) else {}\n    except (ValueError, TypeError):\n\
          \        return {}\n\n\ndef prepare(video_url: str, script: str, rules: str, language: str, base_url:\
          \ str) -> dict:\n    invalid = {'ready': 0, 'submit_url': '', 'base_url': '', 'body': '{}'}\n    try:\n\
          \        base = urlsplit(base_url.rstrip('/'))\n        media = urlsplit(video_url)\n        if (base.scheme\
          \ != 'https' or not base.hostname or base.username or base.password\n                or base.port not\
          \ in (None, 443) or base.query or base.fragment or base.path not in ('', '/api')\n                or media.scheme\
          \ != 'https' or not media.hostname or media.username or media.password or media.fragment):\n         \
          \   return invalid\n        base_path = 'https://' + base.netloc + (base.path or '')\n        body = {'video_url':\
          \ video_url, 'script': script or '', 'rules': rules or '', 'language': language or 'en-US'}\n        return\
          \ {'ready': 1, 'submit_url': base_path + '/jobs', 'base_url': base_path,\n                'body': json.dumps(body,\
          \ ensure_ascii=False)}\n    except (ValueError, TypeError, AttributeError):\n        return invalid\n\n\
          \ndef parse_submit(body: str, status: int, base_url: str) -> dict:\n    invalid = {'ready': 0, 'poll_url':\
          \ ''}\n    data = _obj(body)\n    job_id = data.get('job_id')\n    if status not in (200, 201, 202) or\
          \ not isinstance(job_id, str) or not re.fullmatch(r'[A-Za-z0-9_-]{1,100}', job_id):\n        return invalid\n\
          \    return {'ready': 1, 'poll_url': base_url + '/jobs/' + job_id}\n\n\ndef parse_poll(body: str, status:\
          \ int) -> dict:\n    failed = {'done': 1, 'report': '检测任务失败或返回数据无效，请稍后重试；本次不生成评分。'}\n    data = _obj(body)\n\
          \    if status != 200:\n        return failed\n    state = data.get('status')\n    if state in ('pending',\
          \ 'running'):\n        return {'done': 0, 'report': ''}\n    result = data.get('result')\n    if state\
          \ != 'succeeded' or not isinstance(result, dict):\n        return failed\n    report = result.get('report')\n\
          \    verdict = result.get('verdict')\n    total = result.get('total')\n    if (not isinstance(report,\
          \ str) or not report.strip() or len(report) > 100000\n            or verdict not in ('通过', '转人工') or type(result.get('coverage_complete'))\
          \ is not bool\n            or (verdict == '通过' and (result['coverage_complete'] is not True\n        \
          \        or type(total) not in (int, float) or not math.isfinite(total) or not 80 <= total <= 100))):\n\
          \        return failed\n    return {'done': 1, 'report': report}\n\n\ndef output(done: int, report: str)\
          \ -> dict:\n    if done == 1 and isinstance(report, str) and report.strip():\n        return {'report':\
          \ report}\n    return {'report': '检测任务仍在处理中或已超时，本次不生成评分；请联系服务管理员查询任务状态。'}\n\nmain = prepare\n"
        variables:
        - variable: video_url
          value_selector:
          - start
          - video
          - url
          value_type: string
        - variable: script
          value_selector:
          - start
          - script
          value_type: string
        - variable: rules
          value_selector:
          - start
          - rules
          value_type: string
        - variable: language
          value_selector:
          - start
          - asr_language
          value_type: string
        - variable: base_url
          value_selector:
          - env
          - FULL_FRAME_BASE_URL
          value_type: string
        outputs:
