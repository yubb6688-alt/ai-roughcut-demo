          \ ''}\n    data = _obj(body)\n    job_id = data.get('job_id')\n    if status not in (200, 201, 202) or\
          \ not isinstance(job_id, str) or not re.fullmatch(r'[A-Za-z0-9_-]{1,100}', job_id):\n        return invalid\n\
          \    return {'ready': 1, 'poll_url': base_url + '/jobs/' + job_id}\n\n\ndef parse_poll(body: str, status:\
          \ int) -> dict:\n    failed = {'done': 1, 'report': '检测任务失败或返回数据无效，请稍后重试；本次不生成评分。'}\n    data = _obj(body)\n\
          \    if status != 200:\n        return failed\n    state = data.get('status')\n    if state in ('pending',\
          \ 'running'):\n        return {'done': 0, 'report': ''}\n    result = data.get('result')\n    if state\
          \ != 'succeeded' or not isinstance(result, dict):\n        return failed\n    report = result.get('report')\n\
          \    verdict = result.get('verdict')\n    total = result.get('total')\n    if (not isinstance(report,\
          \ str) or not report.strip() or len(report) > 100000\n            or verdict not in ('通过', '转人工') or type(result.get('coverage_complete'))\
          \ is not bool\n            or (verdict == '通过' and (result['coverage_complete'] is not True\n        \
          \        or type(total) not in (int, float) or not math.isfinite(total) or not 80 <= total <= 100))):\n\
          \        return failed\n    return {'done': 1, 'report': report}\n\n\ndef output(done: int, report: str)\
          \ -> dict:\n    if done == 1 and isinstance(report, str) and report.strip():\n        return {'report':\
          \ report}\n    return {'report': '检测任务仍在处理中或已超时，本次不生成评分；请联系服务管理员查询任务状态。'}\n\nmain = output\n"
